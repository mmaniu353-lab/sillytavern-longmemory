name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Audit development and production dependencies
        run: npm audit --audit-level=low
      - name: Build separate extension and backend payloads
        run: npm run build
      - name: Run Node and Python checks
        run: npm test
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Run synthetic browser checks
        run: npm run test:browser
      - name: Upload tested runtime payloads only
        uses: actions/upload-artifact@v4
        with:
          name: longmemory-${{ matrix.os }}-node-${{ matrix.node }}
          if-no-files-found: error
          include-hidden-files: false
          path: |
            dist/extension/*
            dist/plugin/*
            dist/LICENSE
